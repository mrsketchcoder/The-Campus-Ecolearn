<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>The Campus: Eco Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a24;--pn:#192a38;--pn2:#213648;--bd:#34546a;--tx:#eaf2f6;--mu:#9bb3c2;--ac:#f4b942;--ac2:#3fc4a8;--rd:#e8584a;--gd:#7be3a0;--hp:#e8584a;--en:#f4d03f;--hu:#f0883a;--th:#4aa8e8;--r:12px}
:root[data-theme=light]{--bg:#0f1a24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1118;color:var(--tx);font-family:'Sarabun','Mitr',system-ui,sans-serif;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
h1,h2,h3,.ttl,.btn,.tab{font-family:'Mitr','Sarabun',sans-serif}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left))}
#hud[hidden],#dlg[hidden],#touch[hidden],#prompt[hidden]{display:none!important}
.hbox{position:absolute;background:rgba(15,26,36,.78);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(4px);padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#hl{left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;min-width:176px}
#hav{width:44px;height:44px;border-radius:50%;background:#2a4258;border:2px solid var(--ac);overflow:hidden;flex:none}#hav canvas{width:100%;height:100%;image-rendering:pixelated}
#hbars{flex:1;min-width:110px}#hnm{font:500 13px 'Mitr';display:flex;justify-content:space-between;gap:6px;white-space:nowrap}#hnm span{color:var(--ac)}
.bar{display:flex;align-items:center;gap:4px;height:9px;margin-top:3px;font-size:9px;line-height:9px}.bar b{width:12px;font-size:10px;text-align:center}.bar i{flex:1;height:6px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;position:relative}.bar i u{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .3s}
#hr{right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));text-align:right;min-width:150px}
#hclk{font:600 18px 'Mitr';letter-spacing:.5px}#hdate{font-size:12px;color:var(--mu)}#hmon{font:500 15px 'Mitr';color:var(--ac)}#hzone{font-size:12px;color:var(--ac2);max-width:200px;margin-left:auto}
#hheat{color:#ff6a5a;font-size:13px;height:16px;letter-spacing:2px}
#hq{right:max(8px,env(safe-area-inset-right));top:max(112px,calc(env(safe-area-inset-top) + 104px));max-width:min(260px,46vw);font-size:12.5px;line-height:1.35;padding:6px 9px;text-align:left;border-left:3px solid var(--ac)}
#hq b{color:var(--ac);font:500 11px 'Mitr';display:block;letter-spacing:.4px}
#hbtn{position:absolute;right:max(8px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.rb{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);background:rgba(25,42,56,.9);color:var(--tx);font-size:20px;cursor:pointer;display:grid;place-items:center;position:relative}
.rb:active{transform:scale(.92);background:var(--pn2)}.rb .dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--rd);border:2px solid var(--pn);display:none}.rb.ntf .dot{display:block}
#prompt{position:fixed;left:50%;bottom:max(76px,calc(env(safe-area-inset-bottom) + 70px));transform:translateX(-50%);z-index:6;background:rgba(15,26,36,.92);border:1px solid var(--ac);color:var(--tx);padding:7px 16px;border-radius:30px;font:500 14px 'Mitr';cursor:pointer;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#prompt kbd{background:var(--ac);color:#1a1205;border-radius:6px;padding:1px 7px;margin-right:8px;font:600 13px 'Mitr'}
#toasts{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,92vw)}
.toast{background:rgba(15,26,36,.94);border:1px solid var(--bd);padding:7px 14px;border-radius:10px;font-size:13.5px;animation:tin .25s;box-shadow:0 3px 10px rgba(0,0,0,.4);text-align:center;transition:opacity .4s,transform .4s;white-space:pre-line}
.toast.out{opacity:0;transform:translateY(-6px)}.toast.good{border-color:var(--gd);color:#d8ffe6}.toast.bad{border-color:var(--rd);color:#ffd9d4}.toast.warn{border-color:var(--ac);color:#ffeec4}.toast.gold{border-color:var(--ac);background:linear-gradient(90deg,#3a2c0c,#192a38);color:#ffe49a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(25,42,56,.5);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(244,185,66,.75);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#tb{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(74px,calc(env(safe-area-inset-bottom) + 70px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tb button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(25,42,56,.7);color:#fff;font:600 19px 'Mitr';touch-action:none}
#tb button:active,#tb button.on{background:rgba(244,185,66,.85);color:#1a1205}
#layer{position:fixed;inset:0;z-index:20;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,20,.62);backdrop-filter:blur(3px);pointer-events:auto;padding:10px;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.win{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--bd);border-radius:16px;width:min(700px,100%);max-height:min(92vh,100%);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.win.small{width:min(470px,100%)}.win.wide{width:min(920px,100%)}
.whd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);background:rgba(0,0,0,.18)}
.whd h2{margin:0;font-size:17px;font-weight:500;color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:8px}.x:hover{background:rgba(255,255,255,.1);color:#fff}
.wbd{padding:12px 14px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.msg{margin:6px 0 12px;line-height:1.5;white-space:pre-line}.msg.big{font-size:16.5px}.hint{color:var(--mu);font-size:12.5px;margin:10px 0 0}
.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:8px 15px;font-size:14px;cursor:pointer;transition:.12s;touch-action:manipulation}
.btn:hover{border-color:var(--ac);background:#2b4560}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:#1a1205;border-color:var(--ac);font-weight:600}.btn.pri:hover{background:#ffcb5a}
.btn.danger{border-color:var(--rd);color:#ffb4ac}.btn.danger:hover{background:#4a2420}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.big{min-width:78px;padding:10px 12px}.btn .em{font-size:26px;display:block}.btn small{display:block;font-size:11px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row.wrap{flex-wrap:wrap}.row.center{justify-content:center}.col{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.rowi{display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.07);border-radius:10px}
.rowi>div{flex:1;min-width:0}.rowi small{display:block;color:var(--mu);font-size:12px;margin-top:1px}.rowi .pr{color:var(--ac);font:500 14px 'Mitr';white-space:nowrap}.rowi>span:not(.pr):not(.tag){color:var(--mu)}
.tag{background:rgba(63,196,168,.18);color:var(--ac2);border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
.money{font:500 15px 'Mitr';color:var(--ac);margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab{background:rgba(0,0,0,.25);border:1px solid transparent;color:var(--mu);border-radius:20px;padding:6px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap}.tab.on{background:var(--ac);color:#1a1205;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:rgba(0,0,0,.25);border:1px solid var(--bd);color:var(--tx);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13.5px}.chip.on{background:var(--ac2);color:#06231c;border-color:var(--ac2);font-weight:600}
h3{font-size:14px;font-weight:500;color:var(--ac2);margin:12px 0 6px}
.meter{height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac2)}.meter.gd i{background:var(--ac)}
.tm{height:7px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin-bottom:8px}.tm i{display:block;height:100%;background:var(--ac);transition:width .25s linear}
.seq{display:flex;gap:8px;justify-content:center;margin:10px 0;font-size:34px}.seq span{opacity:.4;padding:4px 8px;border-radius:10px;border:2px solid transparent}.seq span.cu{opacity:1;border-color:var(--ac);background:rgba(244,185,66,.12)}.seq span.dn{opacity:.15}
.bigitem{text-align:center;font-size:56px;margin:10px 0}.bigitem b{display:block;font:500 16px 'Mitr';margin-top:4px}
.binh{border-left:6px solid;padding:6px 10px;margin-bottom:8px;font:500 16px 'Mitr';display:flex;align-items:center;gap:10px}.binh i{width:22px;height:26px;border-radius:4px;display:block}
.bul{margin:4px 0;padding-left:18px;line-height:1.55}.bul li{margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:rgba(0,0,0,.22);border:1px solid var(--bd);border-radius:12px;padding:9px;text-align:center;cursor:pointer}.card:hover{border-color:var(--ac)}.card.on{border-color:var(--ac);background:rgba(244,185,66,.13)}.card b{display:block;font:500 13.5px 'Mitr'}.card small{color:var(--mu);font-size:11.5px;display:block;margin-top:2px}.card .em{font-size:26px}
/* dialogue */
#dlg{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(860px,96vw);z-index:30;background:linear-gradient(180deg,rgba(30,50,68,.97),rgba(18,32,44,.98));border:2px solid var(--ac);border-radius:16px;padding:12px 14px 14px 132px;min-height:112px;box-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer}
#dlg.sys{padding-left:16px;border-color:var(--ac2)}
#dlg .dpt{position:absolute;left:10px;bottom:10px;width:112px;height:112px;border-radius:12px;background:#27455a;border:2px solid var(--bd);overflow:hidden}#dlg .dpt canvas{width:112px;height:112px;image-rendering:auto}
#dname{font:500 15px 'Mitr';color:var(--ac);margin-bottom:3px;min-height:18px}#dtx{font-size:16.5px;line-height:1.5;min-height:50px;white-space:pre-line}
#dnext{position:absolute;right:14px;bottom:8px;color:var(--ac);animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(3px)}}
#dch{display:flex;flex-direction:column;gap:6px;margin-top:8px}.chb{background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:8px 12px;text-align:left;font:500 14.5px 'Sarabun','Mitr';cursor:pointer}.chb:hover{border-color:var(--ac);background:rgba(244,185,66,.12)}.chb b{display:inline-block;background:var(--ac);color:#1a1205;border-radius:6px;min-width:20px;text-align:center;margin-right:8px;font-size:12px}
@media(max-width:560px){#dlg{padding-left:12px;padding-top:56px}#dlg .dpt{width:72px;height:72px;left:12px;top:-30px;bottom:auto}#dlg .dpt canvas{width:72px;height:72px}#dname{position:absolute;left:92px;top:8px}#dtx{font-size:15px}.win{max-height:94vh}#hq{top:max(104px,calc(env(safe-area-inset-top) + 100px))}}
#fade{position:fixed;inset:0;background:#05090d;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
/* title */
#title{position:fixed;inset:0;z-index:40;background:#0b1620;display:flex;align-items:center;justify-content:center;overflow:auto}
#title:empty{display:none}
#title canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.tbox{position:relative;text-align:center;padding:20px;max-width:560px;width:100%}
.logo{font:600 clamp(34px,8vw,64px)/1.05 'Mitr';color:var(--ac);text-shadow:0 3px 0 #7a4a08,0 8px 30px rgba(244,185,66,.35)}.logo small{display:block;font:500 clamp(16px,3.6vw,26px) 'Mitr';color:var(--ac2);text-shadow:0 2px 0 #08362e;margin-top:4px;letter-spacing:2px}
.tsub{color:#cfe3ec;margin:14px 0 22px;font-size:14.5px;text-shadow:0 2px 6px #000}
.tbtns{display:flex;flex-direction:column;gap:10px;align-items:center}.tbtns .btn{width:min(280px,80vw);font-size:17px;padding:12px}
.creator{position:relative;width:min(980px,100%);margin:auto;display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px;text-align:left;background:rgba(15,26,36,.92);border:1px solid var(--bd);border-radius:18px;max-height:100%;overflow:auto}
.creator .pv{text-align:center}.creator .pv canvas{background:linear-gradient(#2a4a62,#1b3345);border-radius:14px;border:2px solid var(--ac);image-rendering:pixelated}
.creator input[type=text]{width:100%;background:#0f1a24;border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:9px 12px;font:500 16px 'Mitr';user-select:text;-webkit-user-select:text}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:block}.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
@media(max-width:700px){.creator{grid-template-columns:1fr}.creator .pv{display:flex;gap:10px;justify-content:center;align-items:center}}
/* phone */
.phwrap{display:flex;justify-content:center;align-items:center;height:100%}
.phone{width:min(330px,96vw);height:min(660px,92vh);background:#05080b;border-radius:34px;padding:10px;border:3px solid #2c3f4e;box-shadow:0 14px 50px rgba(0,0,0,.7);position:relative;display:flex;flex-direction:column}
.pscr{flex:1;border-radius:24px;overflow:hidden;background:#101c27;display:flex;flex-direction:column;position:relative}
.pstat{display:flex;justify-content:space-between;padding:6px 16px 3px;font-size:11.5px;color:#cfe;background:rgba(0,0,0,.35)}
.pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative}
.papps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:16px 10px}
.papp{text-align:center;cursor:pointer;font-size:10.5px;color:#fff;position:relative}.papp i{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;margin:0 auto 4px;font:600 22px 'Mitr',sans-serif;font-style:normal;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.4)}.papp:active i{transform:scale(.92)}.papp .bd{position:absolute;top:-4px;right:6px;background:var(--rd);border-radius:10px;min-width:17px;height:17px;font-size:10px;line-height:17px;font-weight:700}
.pnav{display:flex;justify-content:space-around;padding:8px;background:rgba(0,0,0,.4)}.pnav button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:2px 22px;border-radius:12px}.pnav button:active{background:rgba(255,255,255,.15)}
.ph-h{padding:10px 14px;font:500 17px 'Mitr';background:linear-gradient(90deg,var(--g1,#2a4a62),var(--g2,#1b3345));color:#fff}
.ph-c{padding:10px 12px}.ph-c .rowi{background:rgba(255,255,255,.06)}
.bub{max-width:80%;padding:7px 11px;border-radius:14px;margin:5px 0;font-size:13.5px;line-height:1.4;white-space:pre-line}.bub.me{margin-left:auto;background:#2f8f6a;border-bottom-right-radius:4px}.bub.th{background:#2a3d4d;border-bottom-left-radius:4px}
.post{background:rgba(255,255,255,.06);border-radius:12px;padding:9px;margin-bottom:9px;font-size:13px}.post img{width:100%;border-radius:8px;display:block;margin-bottom:5px;image-rendering:auto}
.phthumb{width:calc(33.3% - 4px);aspect-ratio:1.4;object-fit:cover;border-radius:6px;border:2px solid transparent;display:inline-block;margin:2px}.phthumb.on{border-color:var(--ac)}
.dark{filter:brightness(.4)}
@media (hover:none){.btn:hover{background:var(--pn2);border-color:var(--bd)}}

/* ===== v3 UI: HD-2D / Octopath-inspired frames ===== */
:root{--bg:#0c1424;--pn:#16223a;--pn2:#1f3050;--bd:#4a6288;--ac:#ecbc4e;--gold2:#fff0b8;--ac2:#46d0b0;--r:10px;--glow:0 0 0 1px rgba(236,188,78,.25),0 8px 28px rgba(0,0,0,.55)}

#hr{padding:6px 11px;min-width:158px}#hclk{font:600 21px 'Mitr';color:var(--gold2);text-shadow:0 0 10px rgba(236,188,78,.4)}
#htmp{font:500 13px 'Mitr';margin-top:1px}#htmp small{color:var(--mu);font-size:11.5px}
#hq{top:max(140px,calc(env(safe-area-inset-top) + 134px));border-left:3px solid var(--ac);background:linear-gradient(90deg,rgba(236,188,78,.14),rgba(12,20,36,.9) 40%)}

@media(max-height:430px),(max-width:520px){#mini{width:92px;height:62px;top:max(120px,calc(env(safe-area-inset-top) + 116px))}}

 while(true){let fr=Dlg.stack[Dlg.stack.length-1];if(!fr){Dlg.end();return}

 const pt=$('#dlg .dpt');pt.style.visibility=look?'visible':'hidden';if(look){const c=portrait(look,mood,128),cv=$('#dlg canvas');cv.width=128;cv.height=128;const x=cv.getContext('2d');x.clearRect(0,0,128,128);x.drawImage(c,0,0)}
 $('#dname').textContent=nm;$('#dlg').classList.toggle('sys',who==='sys');Dlg.full=tx(txt);Dlg.pos=0;Dlg.done=false;$('#dtx').textContent='';$('#dnext').style.opacity=0;clearInterval(Dlg.tm);
 Dlg.tm=setInterval(()=>{Dlg.pos+=(SET.textSpd||2);Snd.blip&&Snd.blip();if(Dlg.pos>=Dlg.full.length){Dlg.fin();return}$('#dtx').textContent=Dlg.full.slice(0,Dlg.pos)},28)};

 const keep=Dlg.stack[Dlg.stack.length-1];if(!o.j&&keep)keep.i=keep.a.length;if(o.s)Dlg.stack.push({a:o.s.slice(),i:0});Dlg.next()};

/* ---------- collision & placement ---------- */
function blockedAt(m,x,y){const t=TS;return m.isSol(Math.floor((x-4)/t),Math.floor((y-1)/t))||m.isSol(Math.floor((x+4)/t),Math.floor((y-1)/t))||m.isSol(Math.floor((x-4)/t),Math.floor((y-5)/t))||m.isSol(Math.floor((x+4)/t),Math.floor((y-5)/t))}
function stepEnt(o,dx,dy){const m=W.map;let moved=false;if(dx&&!blockedAt(m,o.x+dx,o.y)){o.x+=dx;moved=true}if(dy&&!blockedAt(m,o.x,o.y+dy)){o.y+=dy;moved=true}return moved}
function nearestFree(m,tx,ty){for(let r=0;r<14;r++)for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;if(!m.isSol(tx+i,ty+j))return{x:(tx+i)*16+8,y:(ty+j)*16+13}}return{x:tx*16+8,y:ty*16+13}}
function randFreeIn(m,area,avoid){const a=m.areas[area];if(!a)return{x:m.entry.x*16+8,y:m.entry.y*16+13};
 for(let k=0;k<40;k++){const tx=ri(a[0],a[2]),ty=ri(a[1],a[3]);if(m.isSol(tx,ty))continue;const x=tx*16+8,y=ty*16+13;if(avoid&&Math.hypot(x-avoid.x,y-avoid.y)<avoid.r)continue;return{x,y}}
 return nearestFree(m,(a[0]+a[2])>>1,(a[1]+a[3])>>1)}

function genLitter(m){let e=LIT[m.id];if(e&&e.day===dayN()){W.lit=e.list;return}
 const list=[];const types=['bottle','bottle','can','paper','wrapper','wrapper','foam','peel','cup','bag','battery'];const r=mkrng(hash(m.id)+dayN()*7919);
 (m.lz||[]).forEach(z=>{const area=(z.x1-z.x0+1)*(z.y1-z.y0+1);const n=Math.round(area/110*z.w*(1.25-cleanOf(z.id)/100)*(m.indoor?.6:1));
  for(let k=0,t=0;k<n&&t<n*20;t++){const tx=z.x0+Math.floor(r()*(z.x1-z.x0+1)),ty=z.y0+Math.floor(r()*(z.y1-z.y0+1));if(m.isSol(tx,ty))continue;list.push({x:tx*16+4+r()*8,y:ty*16+6+r()*8,type:types[Math.floor(r()*types.length)],seed:r()});k++}});
 LIT[m.id]={day:dayN(),list};W.lit=list}
function enterMap(id,tx,ty){const m=getMap(id);W.map=m;W.mid=id;G.map=id;W.npcs=[];W.nm={};W.cars=[];W.fx=[];

 W.p.x=tx*16+8;W.p.y=ty*16+13;W.p.dir=0;W.p.atk=0;W.dl=1;W.chase=0;if(m.indoor&&W.p.ride)W.p.ride=null;
 genLitter(m);syncNPCs(true);spawnPet(true);W.camSnap=1;W.carT=0;
 if(!m.indoor){const z=zoneAt(m,tx,ty);if(z){const k=z.n.en;if(!G.seen[k]){G.seen[k]=1;addXP(6);toast({th:'ค้นพบ: '+z.n.th,en:'Discovered: '+z.n.en},'gold')}}W.zone=z}

 if(d.exit){const e=W.map.exitTo||EXITS[W.mid];if(e){Snd.play('door');goMap(e.map,e.tx,e.ty)}return}
 if(d.to){if(d.hours&&!(hr()>=d.hours[0]&&hr()<d.hours[1])){toast(d.lockMsg||L('ปิดอยู่ (เปิด '+clockStr(d.hours[0]*60)+'–'+clockStr(d.hours[1]*60)+')','Closed (opens '+clockStr(d.hours[0]*60)+'–'+clockStr(d.hours[1]*60)+')'),'bad');return}

function slotOf(n){const h=hr(),w=isWE();for(const s of n.slots){if(s.d==='wk'&&w)continue;if(s.d==='we'&&!w)continue;if(h>=s.a&&h<s.b)return s}return null}
function placeOf(n){const o=NPCO[n.id];if(o)return o;if(typeof eventPlace==='function'){const e=eventPlace(n);if(e)return e}if(G.f['sick_'+n.id])return null;return slotOf(n)}
function syncNPCs(first){const m=W.map;for(const id of NPC_IDS){const n=NPCS[id];const pl=placeOf(n);const here=pl&&pl.map===W.mid;const o=W.nm[id];

function miniSeq(cfg,done){let ord=0,pos=0,score=0,t=cfg.time,over=false;const newSeq=()=>Array.from({length:cfg.len},()=>ri(0,cfg.items.length-1));let seq=newSeq();let iv;
 const fin=()=>{if(over)return;over=true;clearInterval(iv);if(el.parentNode)closeEl(el);done(score,cfg.orders)};
 const el=openWin(cfg.title,()=>'<div class="tm"><i style="width:'+(t/cfg.time*100)+'%"></i></div><p class="msg">'+T(L('ออเดอร์ ','Order '))+(ord+1)+'/'+cfg.orders+' · '+T(L('ถูก ','Done '))+score+'</p><div class="seq">'+seq.map((s,i)=>'<span class="'+(i<pos?'dn':i===pos?'cu':'')+'">'+cfg.items[s].i+'</span>').join('')+'</div><div class="row wrap center">'+cfg.items.map((it,i)=>'<button class="btn big" onclick="'+cb(()=>press(i))+'"><span class="em">'+it.i+'</span><small>'+T(it.l)+'</small></button>').join('')+'</div>',{cls:'small',onclose:()=>{if(!over){over=true;clearInterval(iv);done(score,cfg.orders)}}});

 PH.after=b=>{$$('.bpc',b).forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(B.mv<=0)return;const col=B.g[i],seen=new Set(),st=[i];while(st.length){const k=st.pop();if(seen.has(k)||B.g[k]!==col)continue;seen.add(k);const x=k%N,y=Math.floor(k/N);if(x>0)st.push(k-1);if(x<N-1)st.push(k+1);if(y>0)st.push(k-N);if(y<N-1)st.push(k+N)}if(seen.size<2){Snd.play('err');return}B.mv--;B.sc+=seen.size*seen.size;seen.forEach(k=>B.g[k]=ri(0,3));drain(.1);Snd.play('ok');if(B.mv<=0){mod('mood',Math.min(14,Math.round(B.sc/12)));passTime(8);toast({th:'จบเกม! '+B.sc+' แต้ม ผ่อนคลายขึ้น',en:'Game over! '+B.sc+' pts — you feel relaxed'},'good');bump('games')}PH.keepScroll=true;phRender()})};
 return ph('BlockPop','<p class="msg">'+T(L('แตะกลุ่มสีเดียวกัน 2 ช่องขึ้นไป · เหลือ ','Tap groups of 2+ same colours · moves left '))+B.mv+' · '+B.sc+'</p><div style="display:grid;grid-template-columns:repeat('+N+',1fr);gap:4px">'+B.g.map((c,i)=>'<div class="bpc" data-i="'+i+'" style="aspect-ratio:1;border-radius:8px;background:'+C[c]+';cursor:pointer"></div>').join('')+'</div>'+(B.mv<=0?'<div class="row center" style="margin-top:8px">'+btn(T(L('เล่นใหม่','Again')),()=>{PH.data.bp=null;PH.sub=null;phRender()},'pri')+'</div>':''),['#ff6aa0','#c8307a'])};

  [L('คงระบบแต่งตั้งเพื่อความต่อเนื่อง','Keep appointments for continuity'),L('ข้อดี: นโยบายระดับชาติสอดคล้อง · ข้อโต้แย้ง: ประชาชนมีเสียงน้อยกว่า','Pros: consistency with national policy. Counter: citizens have less say.')]],agree:L('ทุกฝ่ายอยากให้บริการสาธารณะดีขึ้น ต่างกันที่ "ใครควรเป็นผู้ตัดสินใจ"','All sides want better public services; they differ on who should decide.')},
 {k:'th_draft',tag:L('ในประเทศ','Home'),q:L('การเกณฑ์ทหาร: อาสาสมัครล้วนหรือจับสลาก?','Conscription: all-volunteer or lottery?'),o:[
  [L('อาสาสมัครล้วน ให้ค่าตอบแทนดี','All-volunteer with good pay'),L('ข้อดี: กำลังพลที่ตั้งใจ ผู้ถูกบังคับน้อยลง · ข้อโต้แย้ง: งบประมาณสูง และอาจมีกำลังพลไม่พอ','Pros: motivated force, no compulsion. Counter: high cost, possible shortfalls.')],
  [L('ระบบจับสลากหรือบังคับตามเดิม','Keep a lottery/compulsory model'),L('ข้อดี: ได้กำลังพลแน่นอน ค่าใช้จ่ายน้อยกว่า · ข้อโต้แย้ง: ไม่เป็นธรรมกับบางคน และมีปัญหาการละเมิดสิทธิ','Pros: guaranteed numbers, lower cost. Counter: unfair to some; rights concerns.')],
  [L('ปรับเป็นการบริการสังคมทางเลือก (เช่น กู้ภัย/สิ่งแวดล้อม)','Offer civil-service alternatives (rescue, environment)'),L('ข้อดี: ใช้ทักษะเพื่อสังคม · ข้อโต้แย้ง: ต้องออกแบบให้เท่าเทียมและตรวจสอบได้','Pros: skills serve society. Counter: must be fair and auditable.')]],agree:L('เห็นตรงกันว่าประเทศต้องมีความมั่นคง ต่างกันที่วิธีการ','Most agree on needing security, but not on the method.')},
 {k:'g_climate',tag:L('โลก','World'),q:L('การเงินเพื่อสภาพภูมิอากาศ: ใครควรจ่ายมากกว่ากัน?','Climate finance: who should pay more?'),o:[
  [L('ประเทศร่ำรวยที่ปล่อยมานานควรรับผิดชอบมากกว่า','Rich countries with long emissions should pay more'),L('เหตุผล: ปล่อยสะสมมากกว่า · ข้อโต้แย้ง: ประเทศผู้ปล่อยรายใหญ่ปัจจุบันก็ควรร่วมรับผิดชอบ','Reason: bigger historical emissions. Counter: today\'s largest emitters should share the load.')],
  [L('ทุกประเทศที่ปล่อยมาก ณ ตอนนี้ ควรจ่ายตามปริมาณปัจจุบัน','All big current emitters should pay by present emissions'),L('เหตุผล: แก้ปัญหาที่เกิดอยู่ · ข้อโต้แย้ง: ประเทศกำลังพัฒนาจะเสียเปรียบจากการเติบโตทีหลัง','Reason: tackles current output. Counter: developing countries are penalised for developing later.')],
  [L('ใช้กลไกตลาด/ภาษีคาร์บอนที่เป็นกลาง','Use market tools / carbon pricing'),L('เหตุผล: ประหยัดและยืดหยุ่น · ข้อโต้แย้ง: ผู้มีรายได้น้อยอาจรับภาระมากเกินไป','Reason: efficient and flexible. Counter: low-income households may carry too much burden.')]],agree:L('ทุกฝ่ายเห็นว่าต้องลดการปล่อยก๊าซ ต่างกันที่การแบ่งภาระ','All agree emissions must fall; they differ on how to share the burden.')},
 {k:'g_ai',tag:L('โลก','World'),q:L('AI กับการจ้างงาน: จะรับมืออย่างไร?','AI and jobs: how to respond?'),o:[
  [L('ลงทุนฝึกทักษะใหม่ให้แรงงาน','Invest heavily in retraining'),L('ข้อดี: คนปรับตัวได้ · ข้อโต้แย้ง: ไม่ทุกคนจะย้ายอาชีพได้ง่าย','Pros: people adapt. Counter: not everyone can switch careers easily.')],
  [L('ออกกฎคุ้มครองงานและกำกับ AI','Regulate AI and protect jobs'),L('ข้อดี: ลดความเสี่ยงตกงานกะทันหัน · ข้อโต้แย้ง: อาจชะลอนวัตกรรม','Pros: cushions sudden job loss. Counter: may slow innovation.')],
  [L('ปล่อยตลาดปรับตัว แล้วช่วยคนที่ตกขบวน','Let markets adapt, then help those left behind'),L('ข้อดี: นวัตกรรมเร็ว · ข้อโต้แย้ง: การช่วยเหลือมักมาช้าเกินไป','Pros: faster innovation. Counter: help often arrives too late.')]],agree:L('เห็นตรงกันว่าเทคโนโลยีควรเป็นประโยชน์ต่อคนส่วนใหญ่','Most agree technology should benefit most people.')},
 {k:'g_war',tag:L('โลก','World'),q:L('ความขัดแย้งและสงครามในโลก: ประชาคมโลกควรทำอะไร?','Wars and conflicts abroad: what should the world do?'),o:[
  [L('ให้ความช่วยเหลือด้านมนุษยธรรมและผู้ลี้ภัยเป็นอันดับแรก','Put humanitarian aid and refugees first'),L('ข้อดี: ช่วยชีวิตพลเรือนทันที · ข้อโต้แย้ง: ไม่ได้แก้ต้นเหตุของความขัดแย้ง','Pros: saves civilians now. Counter: doesn\'t resolve the cause.')],
  [L('ใช้การทูตและมาตรการคว่ำบาตรกดดัน','Use diplomacy and sanctions'),L('ข้อดี: ไม่ใช้กำลัง · ข้อโต้แย้ง: คว่ำบาตรอาจกระทบพลเรือนและประสิทธิภาพไม่แน่นอน','Pros: avoids force. Counter: sanctions can hit civilians; results are uncertain.')],
  [L('ประเทศขนาดกลางทำหน้าที่เจรจาและไม่เลือกข้าง','Middle powers mediate without picking sides'),L('ข้อดี: เปิดช่องเจรจา · ข้อโต้แย้ง: อาจถูกมองว่าไม่ชัดเจนในหลักการ','Pros: keeps channels open. Counter: may be seen as unprincipled.')]],agree:L('ทุกฝ่ายอยากให้พลเรือนปลอดภัย','All sides want civilians kept safe.')},
 {k:'g_trade',tag:L('โลก','World'),q:L('ภาษีนำเข้าและห่วงโซ่อุปทาน: ควรเปิดการค้าหรือปกป้องอุตสาหกรรม?','Tariffs and supply chains: open trade or protect industries?'),o:[
  [L('การค้าเสรี ราคาถูกลงและมีตัวเลือก','Open trade: cheaper goods and more choice'),L('ข้อดี: ผู้บริโภคได้ประโยชน์ · ข้อโต้แย้ง: อุตสาหกรรมในประเทศอาจแข่งไม่ไหว','Pros: consumers benefit. Counter: domestic industries may not compete.')],
  [L('ปกป้องอุตสาหกรรมสำคัญด้วยภาษี','Protect key industries with tariffs'),L('ข้อดี: รักษางานและความมั่นคง · ข้อโต้แย้ง: ราคาสูงขึ้นและอาจเกิดสงครามการค้า','Pros: safeguards jobs and security. Counter: higher prices, trade wars.')],
  [L('กระจายแหล่งผลิตและพึ่งตนเองบางส่วน','Diversify sources, partial self-reliance'),L('ข้อดี: ทนทานต่อวิกฤต · ข้อโต้แย้ง: ต้นทุนช่วงเปลี่ยนผ่านสูง','Pros: resilience to shocks. Counter: costly transition.')]],agree:L('เห็นตรงกันว่าห่วงโซ่อุปทานต้องไม่เปราะบาง','Most agree supply chains shouldn\'t be fragile.')},
 {k:'g_nuke',tag:L('โลก','World'),q:L('พลังงานนิวเคลียร์ เพื่อลดคาร์บอน: เอาหรือไม่เอา?','Nuclear power for decarbonisation: yes or no?'),o:[
  [L('เอา: คาร์บอนต่ำและเสถียร','Yes: low-carbon and stable'),L('ข้อดี: ผลิตไฟได้ตลอดเวลา · ข้อโต้แย้ง: ต้นทุนก่อสร้างสูง ขยะกัมมันตรังสี และความกังวลด้านความปลอดภัย','Pros: steady power. Counter: high build cost, radioactive waste, safety concerns.')],
  [L('ไม่เอา: เน้นโซลาร์ ลม และกักเก็บพลังงาน','No: focus on solar, wind and storage'),L('ข้อดี: สะอาดและกระจายตัว · ข้อโต้แย้ง: ความผันผวนและต้องการระบบกักเก็บมหาศาล','Pros: clean and distributed. Counter: intermittency; huge storage needs.')],
  [L('ผสมผสานหลายแหล่งตามบริบทของแต่ละประเทศ','A mix, depending on each country'),L('ข้อดี: ยืดหยุ่น · ข้อโต้แย้ง: ต้องวางแผนระยะยาวและอาจตัดสินใจไม่เด็ดขาด','Pros: flexible. Counter: needs long planning and may stall decisions.')]],agree:L('ทุกฝ่ายอยากได้ไฟฟ้าที่ราคาเหมาะสมและไม่ทำลายโลก','All want affordable, planet-friendly electricity.')}];
ACT.civics=()=>openCivics();
function openCivics(){const idx=(dayN()+(G.f.civShift||0))%CIVICS.length;let pick_=null;const el=openWin(L('มุมอภิปราย: บ้านเราและโลก','Civics Corner: Home & World'),()=>{const c=CIVICS[idx];let h='<span class="tag">'+T(c.tag)+'</span><p class="msg big">'+T(c.q)+'</p>';
  if(pick_==null)return h+'<p class="hint">'+T(L('ไม่มีคำตอบถูก ผิด — เลือกจุดยืนที่คุณคิด แล้วดูข้อโต้แย้งจากอีกฝั่ง','There\'s no right answer. Choose a position, then read the best counter-argument.'))+'</p><div class="col">'+c.o.map((o,i)=>btn(T(o[0]),()=>{pick_=i;if(!G.civ[c.k]){G.civ[c.k]=i;addXP(18);G.a.kno+=0;mod('mood',3);bump('civics');if(Object.keys(G.civ).length%3===0&&G.a.kno<10){G.a.kno++;toast(L('ความรู้ +1 จากการอภิปรายหลายมุมมอง','Knowledge +1 from weighing many views'),'gold')}}el.render()})).join('')+'</div>';
  return h+'<div class="rowi"><div><b>'+T(L('คุณเลือก','Your pick'))+'</b><small>'+T(c.o[pick_][0])+'</small></div></div><h3>'+T(L('มุมมองที่ต่างกัน','Different views'))+'</h3><div class="list">'+c.o.map((o,i)=>'<div class="rowi"><div><b>'+(i===pick_?'★ ':'')+T(o[0])+'</b><small>'+T(o[1])+'</small></div></div>').join('')+'</div><p class="msg">'+T(c.agree)+'</p><p class="hint">'+T(L('เกมนี้ไม่เชียร์พรรคหรือฝ่ายใด ใช้เป็นจุดเริ่มต้นหาข้อมูลเพิ่มจากหลายแหล่ง','This game doesn\'t back any party or side. Use it as a starting point and check multiple sources.'))+'</p><div class="row">'+btn(T(L('หัวข้ออื่น','Another topic')),()=>{G.f.civShift=(G.f.civShift||0)+1;closeEl(el);openCivics()})+'</div>'},{cls:'small'})}

  const school=/^school|^canteen|^library|^gym/.test(W.mid);

  const fit0=G.a.fit,hp0=new Map(W.npcs.map(o=>[o,o.hp]));G.a.fit=fit0+w.b/1.6;
